# Any webhook delivery. Not part of the OpenAPI document (each event has its own webhook entry
# there); scripts/build.mjs exports it as dist/schemas/webhook-event.schema.json.
title: ShieldLabs webhook event
type: object
description: >-
  Any body ShieldLabs posts to a webhook endpoint. `identification.scored` and `webhook.ping`
  events must match their own schema; events with another `event_type` only need the envelope,
  so a new event type never breaks validation.
required:
  - event_type
  - schema_version
  - created_at
properties:
  event_type:
    type: string
    minLength: 1
    description: Event type, for example `identification.scored` or `webhook.ping`.
    examples:
      - identification.scored
  schema_version:
    $ref: ../components/schemas/SchemaVersion.yaml
  created_at:
    $ref: ../components/schemas/Rfc3339Timestamp.yaml
allOf:
  - if:
      properties:
        event_type:
          const: identification.scored
      required:
        - event_type
    then:
      $ref: ../components/schemas/IdentificationScoredEvent.yaml
  - if:
      properties:
        event_type:
          const: webhook.ping
      required:
        - event_type
    then:
      $ref: ../components/schemas/WebhookPingEvent.yaml
