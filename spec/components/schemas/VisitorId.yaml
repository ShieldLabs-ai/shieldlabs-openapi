type: string
format: uuid
description: >-
  Server-side visitor identifier (UUID v5). It is sticky to the device: a new cookie on a known
  device keeps the existing visitor ID, so clearing cookies usually does not change it. The nil
  UUID appears on identifications without usable device data, such as rate-limit marker rows.
examples:
  - e9f1a3b5-c7d9-4e1f-8a3b-5c7d9e1f3a5b
