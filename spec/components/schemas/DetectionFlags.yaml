type: object
description: |-
  Stable yes/no verdicts for the identification. Always all 19 keys. Branch on these flags and on
  the Risk Score; signal names are for display and logging.

  When `search_bot` is `true`, `incognito`, `check_incomplete`, `ip_mismatch` and
  `javascript_disabled` are always `false`.
required:
  - vpn
  - privacy_relay
  - browser_vpn_proxy
  - tor
  - proxy
  - datacenter_ip
  - abuser
  - os_mismatch
  - os_not_detected
  - timezone_mismatch
  - anti_detect_browser
  - browser_automation
  - ip_mismatch
  - incognito
  - search_bot
  - suspicious_paid_click
  - javascript_disabled
  - stun_not_checked
  - check_incomplete
properties:
  vpn:
    type: boolean
    description: A VPN was detected (scored `vpn` signal).
  privacy_relay:
    type: boolean
    description: A privacy relay such as iCloud Private Relay was detected.
  browser_vpn_proxy:
    type: boolean
    description: >-
      A VPN or proxy built into the browser or one of its extensions. `true` exactly when
      `connection_type` is `browser_vpn_proxy`.
  tor:
    type: boolean
    description: The request came through the Tor network.
  proxy:
    type: boolean
    description: A proxy was detected.
  datacenter_ip:
    type: boolean
    description: The public IP belongs to a datacenter or hosting range.
  abuser:
    type: boolean
    description: The public IP has a record of abuse in IP intelligence.
  os_mismatch:
    type: boolean
    description: The operating system seen on the network differs from the one the browser reports.
  os_not_detected:
    type: boolean
    description: The operating system could not be determined from the User-Agent or the network.
  timezone_mismatch:
    type: boolean
    description: The browser timezone differs from the timezone of the IP location.
  anti_detect_browser:
    type: boolean
    description: An anti-detect browser was detected.
  browser_automation:
    type: boolean
    description: Browser automation was detected, for example a WebDriver-controlled browser.
  ip_mismatch:
    type: boolean
    description: >-
      The public IP differs from the local IP found by the browser network check. Informational:
      it does not add to the score.
  incognito:
    type: boolean
    description: The browser runs in a private window.
  search_bot:
    type: boolean
    description: A search-engine crawler. Its Risk Score is always 0.
  suspicious_paid_click:
    type: boolean
    description: >-
      The visit came from a paid ad click (Google Ads, Meta, TikTok, Microsoft Ads, LinkedIn,
      Pinterest or X) and the Risk Score is 60 or more (the 999 marker included).
  javascript_disabled:
    type: boolean
    description: JavaScript, or the browser APIs the checks need, were unavailable.
  stun_not_checked:
    type: boolean
    description: >-
      The browser network (STUN) check did not complete. Cleared again when a late network result
      arrives.
  check_incomplete:
    type: boolean
    description: >-
      Part of the browser checks timed out, so the verdict rests on partial data. Informational.
