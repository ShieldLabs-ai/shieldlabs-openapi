type: object
description: The 20 public detection signals in scored webhook contract
  2026-10-13. os_mismatch is true when either OS detector fired.
  browser_vpn_proxy contributes to vpn and is not its own flag. Groups and
  owner attribution are separate from this set.
required:
  - vpn
  - proxy
  - privacy_relay
  - check_incomplete
  - stun_not_checked
  - os_not_detected
  - timezone_mismatch
  - javascript_disabled
  - os_mismatch
  - ip_mismatch
  - ws_tcp_latency
  - anti_detect_browser
  - device_spoofing
  - rate_limited
  - incognito
  - search_bot
  - ai_bot
  - browser_automation
  - ai_browser
  - tor
properties:
  vpn:
    type: boolean
    description: A VPN was detected, including a VPN or proxy built into the
      browser. connection_type may still be browser_vpn_proxy.
  proxy:
    type: boolean
    description: A proxy was detected.
  privacy_relay:
    type: boolean
    description: A privacy relay such as iCloud Private Relay was detected.
  check_incomplete:
    type: boolean
    description: Part of the browser checks timed out, so the verdict rests on
      partial data. Informational. Weight 0, and present in signals when true.
  stun_not_checked:
    type: boolean
    description: The browser network (STUN) check did not complete. Cleared again
      when a late network result arrives.
  os_not_detected:
    type: boolean
    description: The operating system could not be determined from the User-Agent or
      the network.
  timezone_mismatch:
    type: boolean
    description: The browser timezone differs from the timezone of the IP location.
  javascript_disabled:
    type: boolean
    description: JavaScript, or the browser APIs the checks need, were unavailable.
  os_mismatch:
    type: boolean
    description: Either operating-system consistency detector fired. The two
      detectors are not separate public flags.
  ip_mismatch:
    type: boolean
    description: "The public IP differs from the local IP found by the browser
      network check. Informational: it does not add to the score."
  ws_tcp_latency:
    type: boolean
    description: The WebSocket-to-TCP latency test fired. This is the public name
      of that detector.
  anti_detect_browser:
    type: boolean
    description: An anti-detect browser was detected.
  device_spoofing:
    type: boolean
  rate_limited:
    type: boolean
    description: The visitor IP is banned for this window. The matching signal
      weight is 999.
  incognito:
    type: boolean
    description: The browser runs in a private window. Weight 0, and present in
      signals when true.
  search_bot:
    type: boolean
    description: A search-engine crawler. Its Risk Score is always 0. Weight 0,
      and present in signals when true.
  ai_bot:
    type: boolean
    description: An already accepted crawler has purpose training or user_fetch.
      ChatGPT-User, Claude-User and Perplexity-User are AI bots, not AI
      browsers. A User-Agent claim alone does not grant an accepted verdict.
      Weight 0, and present in signals when true.
  browser_automation:
    type: boolean
    description: Browser automation was detected, for example a WebDriver-controlled
      browser. Catalogue weight is 90 for task 204 scoring releases; historical
      result versions may retain the earlier weight 60.
  ai_browser:
    type: boolean
    description: A browser has separately verified infrastructure or service
      attribution. A User-Agent claim or provider-only IP proof is insufficient.
      Weight 0, and present in signals when true.
  tor:
    type: boolean
    description: The request came through the Tor network.
additionalProperties: false
