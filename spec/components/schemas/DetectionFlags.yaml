type: object
description: The 20 public detection signals in scored webhook contract
  2026-10-13. os_mismatch is true when either OS detector fired.
  browser_vpn_proxy contributes to vpn and is not its own flag. Groups and
  owner attribution are separate from this set.
required:
  - vpn
  - proxy
  - private_relay
  - check_incomplete
  - network_check_incomplete
  - os_not_detected
  - timezone_mismatch
  - javascript_disabled
  - os_mismatch
  - ip_mismatch
  - latency_test
  - anti_detect_browser
  - device_spoofing
  - rate_limited
  - incognito
  - search_bot
  - ai_bot
  - browser_automation
  - ai_browser
  - tor
properties:
  vpn:
    type: boolean
    description: A VPN was detected, including a VPN or proxy built into the
      browser. connection_type may still be browser_vpn_proxy.
  proxy:
    type: boolean
    description: A proxy was detected.
  private_relay:
    type: boolean
    description: A privacy relay such as iCloud Private Relay was detected.
      Older payloads used privacy_relay.
  check_incomplete:
    type: boolean
    description: Part of the browser checks timed out, so the verdict rests on
      partial data. Informational. Weight 0, and present in signals when true.
      False for a search-engine crawler, an AI bot, or an AI browser.
  network_check_incomplete:
    type: boolean
    description: The browser network (STUN) check did not complete. Cleared again
      when a late network result arrives. Older payloads used stun_not_checked.
  os_not_detected:
    type: boolean
    description: The operating system could not be determined from the User-Agent or
      the network.
  timezone_mismatch:
    type: boolean
    description: The browser timezone differs from the timezone of the IP location.
  javascript_disabled:
    type: boolean
    description: JavaScript, or the browser APIs the checks need, were unavailable.
      False for a search-engine crawler, an AI bot, or an AI browser.
  os_mismatch:
    type: boolean
    description: Either operating-system consistency detector fired. The two
      detectors are not separate public flags.
  ip_mismatch:
    type: boolean
    description: "A qualifying mismatch between the public IP and the browser's
      network evidence was detected. Nominal weight 45; read the returned Risk Score.
      False for a search-engine crawler, an AI bot, or an AI browser."
  latency_test:
    type: boolean
    description: The WebSocket-to-TCP latency test fired. Older payloads used
      ws_tcp_latency.
  anti_detect_browser:
    type: boolean
    description: An anti-detect browser was detected.
  device_spoofing:
    type: boolean
  rate_limited:
    type: boolean
    description: The visitor exceeded the identification rate limit. Older
      payloads used banned_ip.
  incognito:
    type: boolean
    description: The browser runs in a private window. False for a search-engine
      crawler, an AI bot, or an AI browser. Weight 0, and present in
      signals when true.
  search_bot:
    type: boolean
    description: A search-engine crawler. Its Risk Score is always 0. Weight 0,
      and present in signals when true.
  ai_bot:
    type: boolean
    description: A recognized AI bot or crawler. Its Risk Score is always 0.
      ShieldLabs identifies the provider when available.
      Weight 0, and present in signals when true.
  browser_automation:
    type: boolean
    description: Browser automation was detected, for example a WebDriver-controlled
      browser. Catalogue weight is 90 for task 204 scoring releases; historical
      result versions may retain the earlier weight 60.
  ai_browser:
    type: boolean
    description: A recognized AI browser. Its Risk Score is always 0.
      ShieldLabs identifies the provider when available.
      Weight 0, and present in signals when true.
  tor:
    type: boolean
    description: The request came through the Tor network.
additionalProperties: false
