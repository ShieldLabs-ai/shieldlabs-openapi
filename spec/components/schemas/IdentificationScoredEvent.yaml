type: object
description: "Body of an `identification.scored` delivery. The signature is not
  part of the body: it arrives in the `X-Shield-Signature` header."
required:
  - event_type
  - schema_version
  - created_at
  - data
properties:
  event_type:
    type: string
    const: identification.scored
    description: Event type. Ignore events whose type you do not know instead of failing.
  schema_version:
    $ref: ./SchemaVersion.yaml
  created_at:
    $ref: ./Rfc3339Timestamp.yaml
    description: When the event envelope was created, distinct from data.observed_at
      (scan time).
  data:
    $ref: ./IdentificationScoredData.yaml
  event_id: &a1
    type: string
    minLength: 1
    description: Logical site/request/final-result-version/type identity. Stable
      across retries and endpoints.
  site_id:
    type: integer
    minimum: 1
    description: Site scope when available; legacy domain-only accounts omit it.
allOf:
  - if:
      properties:
        schema_version:
          const: 2026-10-06
      required:
        - schema_version
    then:
      required:
        - event_id
      properties:
        data:
          required:
            - result_version
            - scoring_version
            - risk_events
            - hre
          type: object
          additionalProperties: true
          properties:
            result_version: {}
            scoring_version: {}
            risk_events: {}
            hre: {}
        event_id: *a1
      type: object
      additionalProperties: true
