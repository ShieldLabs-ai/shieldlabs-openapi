type: object
description: "Body of an `identification.scored` delivery. The signature is not
  part of the body: it arrives in the `X-Shield-Signature` header."
required:
  - event_type
  - schema_version
  - created_at
  - data
properties:
  event_type:
    type: string
    const: identification.scored
    description: Event type. Ignore events whose type you do not know instead of failing.
  schema_version:
    $ref: ./SchemaVersion.yaml
  created_at:
    $ref: ./Rfc3339Timestamp.yaml
    description: When the event envelope was created, distinct from data.observed_at
      (scan time).
  data:
    $ref: ./IdentificationScoredData.yaml
  event_id: &a1
    type: string
    minLength: 1
    description: Logical site/request/final-result-version/type identity. Stable
      across retries and endpoints.
  site_id:
    type: integer
    minimum: 1
    description: Site scope when available; legacy domain-only accounts omit it.
allOf:
  - if:
      properties:
        schema_version:
          const: 2026-10-06
      required:
        - schema_version
    then:
      required:
        - event_id
      properties:
        data:
          required:
            - result_version
            - scoring_version
            - risk_events
            - hre
          type: object
          additionalProperties: true
          properties:
            result_version: {}
            scoring_version: {}
            risk_events: {}
            hre: {}
        event_id: *a1
      type: object
      additionalProperties: true
  - if:
      type: object
      required:
        - schema_version
      properties:
        schema_version:
          enum: [2026-10-07, 2026-10-08]
      additionalProperties: true
    then:
      type: object
      required:
        - event_id
      properties:
        event_id: *a1
        data:
          type: object
          required:
            - result_version
            - scoring_version
            - hre
          properties:
            result_version: {}
            scoring_version: {}
            risk_events: {}
            fingerprint: {}
            detection_flags:
              type: object
              not:
                type: object
                required:
                  - os_mismatch2
                properties:
                  os_mismatch2: {}
                additionalProperties: true
            hre:
              type: object
              properties:
                account_sharing:
                  type: object
                  required:
                    - cluster_id
                  properties:
                    cluster_id: {}
                  additionalProperties: true
                account_takeover:
                  type: object
                  required:
                    - cluster_id
                  properties:
                    cluster_id: {}
                  additionalProperties: true
                impossible_travel:
                  type: object
                  required:
                    - cluster_id
                  properties:
                    cluster_id: {}
                  additionalProperties: true
          additionalProperties: true
          not:
            anyOf:
              - type: object
                required:
                  - risk_events
                properties:
                  risk_events: {}
                additionalProperties: true
              - type: object
                required:
                  - fingerprint
                properties:
                  fingerprint: {}
                additionalProperties: true
      additionalProperties: true

  - if:
      type: object
      properties:
        schema_version:
          const: 2026-10-08
      required: [schema_version]
    then:
      type: object
      properties:
        data:
          type: object
          properties:
            connection_type:
              type: string
              not:
                const: browser_vpn_proxy
            signals:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    not:
                      const: browser_vpn_proxy
            detection_flags:
              type: object
              not:
                anyOf:
                  - type: object
                    required: [browser_vpn_proxy]
                    properties:
                      browser_vpn_proxy: {}
                  - type: object
                    required: [datacenter_ip]
                    properties:
                      datacenter_ip: {}
                  - type: object
                    required: [abuser]
                    properties:
                      abuser: {}
                  - type: object
                    required: [suspicious_paid_click]
                    properties:
                      suspicious_paid_click: {}
