type: object
description: Detection flags in retained webhook and History payloads before
  2026-10-12. Missing extension flags are not evaluated negative results.
required:
  - vpn
  - privacy_relay
  - tor
  - proxy
  - os_mismatch
  - os_not_detected
  - timezone_mismatch
  - anti_detect_browser
  - browser_automation
  - ip_mismatch
  - incognito
  - search_bot
  - javascript_disabled
  - stun_not_checked
  - check_incomplete
properties:
  vpn:
    type: boolean
    description: A VPN or Browser VPN/Proxy was detected.
  privacy_relay:
    type: boolean
    description: A privacy relay such as iCloud Private Relay was detected.
  browser_vpn_proxy:
    type: boolean
    deprecated: true
    description: A VPN or proxy built into the browser or one of its extensions.
      `true` exactly when `connection_type` is `browser_vpn_proxy`.
  tor:
    type: boolean
    description: The request came through the Tor network.
  proxy:
    type: boolean
    description: A proxy was detected.
  datacenter_ip:
    type: boolean
    deprecated: true
    description: The public IP belongs to a datacenter or hosting range.
  abuser:
    type: boolean
    deprecated: true
    description: The public IP has a record of abuse in IP intelligence.
  os_mismatch:
    type: boolean
    description: Either internal OS consistency check detected a mismatch. The
      public flag combines browser/network and TCP behaviour checks.
  os_not_detected:
    type: boolean
    description: The operating system could not be determined from the User-Agent or
      the network.
  timezone_mismatch:
    type: boolean
    description: The browser timezone differs from the timezone of the IP location.
  anti_detect_browser:
    type: boolean
    description: An anti-detect browser was detected.
  browser_automation:
    type: boolean
    description: Browser automation was detected, for example a WebDriver-controlled
      browser. Catalogue weight is 90 for task 204 scoring releases; historical
      result versions may retain the earlier weight 60.
  ip_mismatch:
    type: boolean
    description: "A qualifying mismatch between the public IP and the browser's
      network evidence was detected. Read the returned Risk Score and signal contributions."
  incognito:
    type: boolean
    description: The browser runs in a private window.
  search_bot:
    type: boolean
    description: A search-engine crawler. Its Risk Score is always 0.
  javascript_disabled:
    type: boolean
    description: JavaScript, or the browser APIs the checks need, were unavailable.
  stun_not_checked:
    type: boolean
    description: The browser network (STUN) check did not complete. Cleared again
      when a late network result arrives.
  check_incomplete:
    type: boolean
    description: Part of the browser checks timed out, so the verdict rests on
      partial data. Informational.
  device_spoofing:
    type: boolean
  latency_test:
    type: boolean
    description: Current public name of the latency detector. Payloads from
      schema 2026-10-13 before the slug rename used ws_tcp_latency.
  ws_tcp_latency:
    type: boolean
    description: Previous public name of the latency detector. Current
      2026-10-13 payloads use latency_test.
  banned_ip:
    type: boolean
    description: Current public name of the banned-IP flag.
  ai_bot:
    type: boolean
    description: An accepted bot is classified as AI training or user-requested
      fetch. ChatGPT-User, Claude-User and Perplexity-User are AI bots, not AI
      browsers. Weight 0. The flag is optional on older payloads; its absence is
      not an evaluated negative result. Provider claims alone do not grant zero
      risk.
  ai_browser:
    type: boolean
    description: A browser is identified by separate verified browser
      infrastructure. A generic browser User-Agent or a verified provider alone
      is insufficient. Weight 0. Optional on older payloads; absence is not an
      evaluated negative.
  os_mismatch2:
    type: boolean
    deprecated: true
    description: Legacy 2026-10-06 only; current payloads combine this check into
      os_mismatch.
