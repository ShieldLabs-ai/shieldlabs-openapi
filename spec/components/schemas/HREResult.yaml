type: object
required:
  - status
  - level
  - reason
properties:
  status:
    type: string
    examples:
      - evaluated
      - not_evaluated
      - not_applicable
  level:
    type:
      - string
      - "null"
    examples:
      - medium
      - high
      - null
  reason:
    type: string
  devices:
    type: integer
    minimum: 0
  min_devices:
    type: integer
    minimum: 1

  cluster_id:
    type: [string, "null"]
    description: Authoritative cluster ID for this HRE result. Null when no cluster was published for the result, including old stored verdicts; never a device ID. Reused on retries.
