type:
  - object
  - "null"
additionalProperties: true
properties:
  schema_version:
    type:
      - string
      - "null"
    description: Open version identifier. Version 1 is currently emitted.
  classification_revision:
    type:
      - integer
      - "null"
    minimum: 1
  classifier_version: &a1
    type:
      - string
      - "null"
  registry_revision: *a1
  availability:
    type:
      - string
      - "null"
    description: available or input_unavailable. Missing object means no stored
      identity data; it does not mean human.
  observed_at:
    type:
      - string
      - "null"
    format: date-time
  decided_at:
    type:
      - string
      - "null"
    format: date-time
  claims:
    type:
      - array
      - "null"
    items:
      type:
        - object
        - "null"
      additionalProperties: true
      properties:
        profile_id: *a1
        provider_id: *a1
        provider_name: *a1
        agent_name: *a1
        client_kind: *a1
        purpose: *a1
        source: *a1
  verified:
    type:
      - array
      - "null"
    items:
      type:
        - object
        - "null"
      additionalProperties: true
      properties:
        subject:
          type:
            - string
            - "null"
          description: "The proved attribute: provider, service or infrastructure. Proof
            does not extend to other attributes."
        value_id: *a1
        evidence_ids: &a2
          type:
            - array
            - "null"
          items: *a1
  assessments:
    type:
      - array
      - "null"
    items:
      type:
        - object
        - "null"
      additionalProperties: true
      properties:
        candidate_profile_id: *a1
        status: *a1
        reason: *a1
  evidence:
    type:
      - array
      - "null"
    items:
      type:
        - object
        - "null"
      additionalProperties: true
      properties:
        id: *a1
        method: *a1
        source_id: *a1
        source_revision: *a1
        checked_at:
          type:
            - string
            - "null"
          format: date-time
        evaluated_at:
          type:
            - string
            - "null"
          format: date-time
        covered_attributes: *a2
        covered_components: *a2
        request_binding: *a1
        replay_policy: *a1
description: Optional best-effort client attribution for webhooks. The object
  and every nested field may be omitted or null. Availability and completeness
  are not guaranteed; integrations must work without this block or any of its
  fields. Missing or null values do not mean human or a negative verification
  result. Claimed names are unverified; a verified provider does not prove a
  service or agent. Unknown fields and string values must be accepted.
