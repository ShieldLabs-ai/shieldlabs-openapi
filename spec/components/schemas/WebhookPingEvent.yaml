type: object
description: >-
  Body of a `webhook.ping` delivery, sent when you verify an endpoint. It has no `data`. The keys
  arrive sorted alphabetically and `created_at` has second precision.
required:
  - event_type
  - schema_version
  - created_at
properties:
  event_type:
    type: string
    const: webhook.ping
    description: Event type.
  schema_version:
    $ref: ./SchemaVersion.yaml
  created_at:
    $ref: ./Rfc3339Timestamp.yaml
    description: When the ping was sent, with second precision.
