type: string
format: uuid
description: >-
  Identifies one identification. The browser creates it as a UUID v4 and hands it to your page;
  it is the join key between the browser, the webhook and the History API. The nil UUID appears
  only on rate-limit marker rows that arrived with a malformed request ID.
examples:
  - 02f1d973-84db-4156-a7f7-e799e6bf389b
