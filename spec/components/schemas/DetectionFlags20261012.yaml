type: object
description: Retained scored webhook contract 2026-10-12. Twenty-one source
  detection signals, with os_mismatch and os_mismatch2 independent. Current
  deliveries use DetectionFlags (2026-10-13).
required:
  - vpn
  - proxy
  - privacy_relay
  - check_incomplete
  - stun_not_checked
  - os_not_detected
  - timezone_mismatch
  - javascript_disabled
  - os_mismatch
  - os_mismatch2
  - ip_mismatch
  - latency_test
  - anti_detect_browser
  - device_spoofing
  - banned_ip
  - incognito
  - search_bot
  - ai_bot
  - browser_automation
  - ai_browser
  - tor
properties:
  vpn:
    type: boolean
    description: A VPN or Browser VPN/Proxy was detected.
  proxy:
    type: boolean
    description: A proxy was detected.
  privacy_relay:
    type: boolean
    description: A privacy relay such as iCloud Private Relay was detected.
  check_incomplete:
    type: boolean
    description: Part of the browser checks timed out, so the verdict rests on
      partial data. Informational.
  stun_not_checked:
    type: boolean
    description: The browser network (STUN) check did not complete. Cleared again
      when a late network result arrives.
  os_not_detected:
    type: boolean
    description: The operating system could not be determined from the User-Agent or
      the network.
  timezone_mismatch:
    type: boolean
    description: The browser timezone differs from the timezone of the IP location.
  javascript_disabled:
    type: boolean
    description: JavaScript, or the browser APIs the checks need, were unavailable.
  os_mismatch:
    type: boolean
    description: The first operating system consistency detector found a mismatch.
      Independent of os_mismatch2.
  os_mismatch2:
    type: boolean
    description: The second operating system consistency detector (TCP behaviour)
      found a mismatch. Independent of os_mismatch.
  ip_mismatch:
    type: boolean
    description: "A qualifying mismatch between the public IP and the browser's
      network evidence was detected. Read the returned Risk Score and signal contributions."
  latency_test:
    type: boolean
  anti_detect_browser:
    type: boolean
    description: An anti-detect browser was detected.
  device_spoofing:
    type: boolean
  banned_ip:
    type: boolean
  incognito:
    type: boolean
    description: The browser runs in a private window.
  search_bot:
    type: boolean
    description: A search-engine crawler. Its Risk Score is always 0.
  ai_bot:
    type: boolean
    description: An already accepted crawler has purpose training or user_fetch.
      ChatGPT-User, Claude-User and Perplexity-User are AI bots, not AI
      browsers. A User-Agent claim alone does not grant an accepted verdict.
  browser_automation:
    type: boolean
    description: Browser automation was detected, for example a WebDriver-controlled
      browser. Catalogue weight is 90 for task 204 scoring releases; historical
      result versions may retain the earlier weight 60.
  ai_browser:
    type: boolean
    description: A browser has separately verified infrastructure or service
      attribution. A User-Agent claim or provider-only IP proof is insufficient.
  tor:
    type: boolean
    description: The request came through the Tor network.
additionalProperties: false
