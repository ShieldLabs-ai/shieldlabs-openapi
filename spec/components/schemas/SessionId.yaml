type: string
format: uuid
description: >-
  One visit on one origin (UUID v4 created in the browser), shared by the open tabs of that
  origin. The next visit after the last tab closes gets a new session ID. The nil UUID appears on
  rate-limit marker rows.
examples:
  - b6c8d0e2-f4a6-4b8c-8d0e-2f4a6b8c0d2e
