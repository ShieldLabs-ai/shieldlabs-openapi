type: object
additionalProperties: true
required:
  - schema_version
  - classification_revision
  - classifier_version
  - registry_revision
  - availability
  - observed_at
  - decided_at
  - claims
  - verified
  - assessments
  - evidence
properties:
  schema_version:
    type: string
    description: Open version identifier. Version 1 is currently emitted.
  classification_revision:
    type: integer
    minimum: 1
  classifier_version: &a1
    type: string
  registry_revision: *a1
  availability:
    type: string
    description: available or input_unavailable. Missing object means no stored
      identity data; it does not mean human.
  observed_at:
    type: string
    format: date-time
  decided_at:
    type: string
    format: date-time
  claims:
    type: array
    items:
      type: object
      additionalProperties: true
      required:
        - profile_id
        - provider_id
        - provider_name
        - agent_name
        - client_kind
        - purpose
        - source
      properties:
        profile_id: *a1
        provider_id: *a1
        provider_name: *a1
        agent_name: *a1
        client_kind: *a1
        purpose: *a1
        source: *a1
  verified:
    type: array
    items:
      type: object
      additionalProperties: true
      required:
        - subject
        - value_id
        - evidence_ids
      properties:
        subject:
          type: string
          description: "The proved attribute: provider, service or infrastructure. Proof
            does not extend to other attributes."
        value_id: *a1
        evidence_ids: &a2
          type: array
          items: *a1
  assessments:
    type: array
    items:
      type: object
      additionalProperties: true
      required:
        - status
        - reason
      properties:
        candidate_profile_id: *a1
        status: *a1
        reason: *a1
  evidence:
    type: array
    items:
      type: object
      additionalProperties: true
      required:
        - id
        - method
        - source_id
        - source_revision
        - checked_at
        - evaluated_at
        - covered_attributes
      properties:
        id: *a1
        method: *a1
        source_id: *a1
        source_revision: *a1
        checked_at:
          type: string
          format: date-time
        evaluated_at:
          type: string
          format: date-time
        covered_attributes: *a2
        covered_components: *a2
        request_binding: *a1
        replay_policy: *a1
description: Stored ingest attribution, independent of risk score and browser
  automation. Claimed names are unverified. A verified provider does not verify
  the agent name, service or AI mode. Read proof scope from each attribution and
  its referenced evidence. Unknown string values and fields must be accepted.
