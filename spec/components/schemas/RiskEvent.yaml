type: object
required:
  - code
  - detected
  - weight
  - contribution
  - status
properties:
  code:
    type: string
  detected:
    type: boolean
    description: Final scoring flag. false does not assert that every underlying
      probe completed.
  weight:
    type: integer
    description: Catalogue weight, not an additive score. Banned IP 999 is a marker.
  contribution:
    type: integer
    description: Matching score details, may contain corrections. Never recompute
      risk_score by summing.
  status:
    type: string
    description: The final scoring flag has been evaluated. Probe incompleteness is
      reported by dedicated risk events.
    examples:
      - evaluated
