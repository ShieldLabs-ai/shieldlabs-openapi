type: object
required:
  - code
  - detected
  - weight
  - contribution
  - status
properties:
  code:
    type: string
    description: >-
      Open catalogue of independent source signals. ai_bot and ai_browser carry
      weight 0; search_bot remains separate. browser_automation carries weight 90
      in task 204 releases. UI Good bot and Bad bot groups are not risk event codes.
      Keep unknown codes and use the payload scoring_version/result_version for
      historical interpretation.
  detected:
    type: boolean
    description: Final scoring flag. false does not assert that every underlying
      probe completed.
  weight:
    type: integer
    description: Catalogue weight, not an additive score. Banned IP 999 is a marker.
  contribution:
    type: integer
    description: Matching score details, may contain corrections. Never recompute
      risk_score by summing.
  status:
    type: string
    description: The final scoring flag has been evaluated. Probe incompleteness is
      reported by dedicated risk events.
    examples:
      - evaluated
