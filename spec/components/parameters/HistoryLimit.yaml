name: limit
in: query
required: false
description: >-
  Maximum number of identifications to return, from 1 to 100. Omit it for 20. Any other value,
  including a non-numeric one, returns `400`.
schema:
  type: integer
  minimum: 1
  maximum: 100
  default: 20
examples:
  one:
    summary: Read one verdict
    value: 1
  page:
    summary: A full page
    value: 100
