name: limit
in: query
required: false
description: >-
  Maximum number of identifications to return, from 1 to 100. The server replaces any other value
  (and a non-numeric one) with 20 instead of clamping it, so validate it on your side.
schema:
  type: integer
  minimum: 1
  maximum: 100
  default: 20
examples:
  one:
    summary: Read one verdict
    value: 1
  page:
    summary: A full page
    value: 100
