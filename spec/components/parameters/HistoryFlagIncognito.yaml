name: is_incognito
in: query
required: false
description: >-
  When set, keep only rows whose `is_incognito` equals this value. Always false for search-engine crawlers, matching the row. Omit the parameter to leave
  the flag unconstrained. The only accepted values are `true` and `false`.
schema:
  type: string
  enum:
    - 'true'
    - 'false'
examples:
  match:
    summary: Only incognito rows
    value: 'true'
