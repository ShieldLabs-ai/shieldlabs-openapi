name: type
in: path
required: true
description: >-
  Identifier to search by. `request_id` is a legacy alias of `identification_id`.
  Other values get a `404` with a bare JSON string such as
  `"auto is not supported"`.
schema:
  type: string
  enum:
    - identification_id
    - request_id
    - device_id
    - user_hid
    - visitor_id
    - ip
    - session_id
    - cookie_id
examples:
  identificationId:
    summary: Search by Identification ID
    value: identification_id
