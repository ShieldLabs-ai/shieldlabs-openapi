name: network_check_incomplete
in: query
required: false
description: >-
  When set, keep only rows whose `network_check_incomplete` equals this value. Omit the parameter to leave
  the flag unconstrained. The only accepted values are `true` and `false`.
schema:
  type: string
  enum:
    - 'true'
    - 'false'
examples:
  match:
    summary: Only rows whose network check is incomplete
    value: 'true'
