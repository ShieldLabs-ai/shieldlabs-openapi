name: banned_ip
in: query
required: false
description: >-
  When set, keep only rows whose `banned_ip` equals this value. Omit the parameter to leave
  the flag unconstrained. The only accepted values are `true` and `false`.
schema:
  type: string
  enum:
    - 'true'
    - 'false'
examples:
  match:
    summary: Only rate-limited rows
    value: 'true'
