name: is_browser_automation
in: query
required: false
description: >-
  When set, keep only rows whose `is_browser_automation` equals this value. Omit the parameter to leave
  the flag unconstrained. The only accepted values are `true` and `false`.
schema:
  type: string
  enum:
    - 'true'
    - 'false'
examples:
  match:
    summary: Only browser-automation rows
    value: 'true'
