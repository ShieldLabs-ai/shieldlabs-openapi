name: offset
in: query
required: false
description: >-
  Number of identifications to skip, for paging. The server treats negative or non-numeric values
  as 0. Rows are ordered by `created_at` only, so paging while new identifications arrive can
  repeat or skip rows: deduplicate on `request_id`.
schema:
  type: integer
  minimum: 0
  default: 0
examples:
  first:
    summary: First page
    value: 0
  second:
    summary: Second page of 100
    value: 100
