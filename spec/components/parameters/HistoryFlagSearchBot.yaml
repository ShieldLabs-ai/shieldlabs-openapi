name: is_search_bot
in: query
required: false
description: >-
  When set, keep only rows whose `is_search_bot` equals this value. Omit the parameter to leave
  the flag unconstrained. The only accepted values are `true` and `false`.
schema:
  type: string
  enum:
    - 'true'
    - 'false'
examples:
  match:
    summary: Only search-engine crawler rows
    value: 'true'
