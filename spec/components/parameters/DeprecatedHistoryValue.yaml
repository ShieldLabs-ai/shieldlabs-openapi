name: value
in: path
required: true
description: >-
  Value of the identifier. UUID types accept a UUID of any version; `ip` must be an IP address
  (an IPv6 address passes validation but then fails with `400` and a `null` body); `user_hid` is
  free text.
schema:
  type: string
  minLength: 1
examples:
  requestId:
    summary: A request ID
    value: a5b7c9d1-e3f5-4a7b-9c1d-3e5f7a9b1c3d
