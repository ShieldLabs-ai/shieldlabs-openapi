name: from
in: query
required: false
description: >-
  Inclusive UTC start. `YYYY-MM-DD` means the start of that day. `YYYY-MM-DD HH:MM:SS` is an exact
  time and may include a fractional second. Omit it for no start bound. Any other value returns `400`.
schema:
  type: string
  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}( [0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?)?$'
examples:
  day:
    summary: Start of a UTC day
    value: '2026-08-01'
  instant:
    summary: An exact UTC time
    value: '2026-08-04 12:00:00'
