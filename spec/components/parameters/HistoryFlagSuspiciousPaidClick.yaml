name: is_suspicious_paid_click
in: query
required: false
description: >-
  When set, keep only rows whose `is_suspicious_paid_click` equals this value. Omit the parameter to leave
  the flag unconstrained. The only accepted values are `true` and `false`.
schema:
  type: string
  enum:
    - 'true'
    - 'false'
examples:
  match:
    summary: Only suspicious paid-click rows
    value: 'true'
