name: is_os_mismatch
in: query
required: false
description: >-
  When set, keep only rows whose `is_os_mismatch` equals this value. Omit the parameter to leave
  the flag unconstrained. The only accepted values are `true` and `false`.
schema:
  type: string
  enum:
    - 'true'
    - 'false'
examples:
  match:
    summary: Only OS-mismatch rows
    value: 'true'
