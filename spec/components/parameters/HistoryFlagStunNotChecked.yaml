name: is_stun_not_checked
in: query
required: false
description: >-
  When set, keep only rows whose `is_stun_not_checked` equals this value. Omit the parameter to leave
  the flag unconstrained. The only accepted values are `true` and `false`.
schema:
  type: string
  enum:
    - 'true'
    - 'false'
examples:
  match:
    summary: Only rows whose network check did not run
    value: 'true'
