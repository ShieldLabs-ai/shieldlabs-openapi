post:
  operationId: identificationScored
  tags:
    - Webhooks
  summary: Identification scored
  description: >-
    Sent after final snapshot scoring and mandatory fp21 + three HRE handlers.
    Risk score is the identification score only. AI bots and AI browser are not
    implemented and not emitted.


    Verify HMAC-SHA256 over exact raw bytes with the endpoint secret. Body
    event_id is signed; X-Shield-Event-Id is its convenience mirror. Persist and
    deduplicate by event_id before returning 2xx within the 1-second send
    timeout. Legacy bodies without event_id can use data.request_id. Retries
    preserve body and ID. Network/timeouts/429/5xx are retried with backoff up
    to 8 failed sends or 15 minutes of retry age; exhaustion/permanent 4xx goes
    to DLQ. Delivery is at-least-once attempts within that window, not
    guaranteed eternal delivery or exactly-once. Endpoints are independent.
    Redirects are not followed.


    Use History for recovery/latest state; later snapshot corrections do not
    automatically emit another identification.scored event.
  security: []
  parameters:
    - $ref: ../components/parameters/ShieldSignature.yaml
    - $ref: ../components/parameters/ShieldEventId.yaml
  requestBody:
    required: true
    description: The event as compact JSON. Verify the signature over these exact bytes.
