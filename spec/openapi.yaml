externalDocs:
  description: ShieldLabs documentation
  url: https://docs.shieldlabs.ai
servers:
  - url: https://account.shieldlabs.ai
    description: History API (every operation also declares its own server)
  - url: https://api.shieldlabs.ai
    description: Management API (every operation also declares its own server)
tags:
  - name: History API
    description: >-
      Read History entities for one public domain UUID on `https://account.shieldlabs.ai`
      with the Private API Key. Lists are `identifications` and `user`. Cards are
      `identifications`, `user`, `visitor`, `device` and `ip`. The old search route returns
      `410 endpoint_retired`.
  - name: Management API
    description: >-
      Domain profile on `https://api.shieldlabs.ai`, authenticated with the Secret Key and the
      `X-Shield-Domain` header. Also serves the deprecated history endpoint until
      1 January 2027.
  - name: Health
    description: Unauthenticated liveness checks on both API hosts.
  - name: Webhooks
    description: >-
      Signed events ShieldLabs sends to your webhook endpoints: `identification.scored` for every
      identification and `webhook.ping` when you verify an endpoint.
paths:
  /api/v1/domains:
    $ref: ./paths/domains.yaml
  /api/v1/domains/{domain_id}/history/{resource}:
    $ref: ./paths/history-entity-list.yaml
  /api/v1/domains/{domain_id}/history/{resource}/{resource_id}:
    $ref: ./paths/history-entity-detail.yaml
  /v1/profile:
    $ref: ./paths/profile.yaml
  /v1/history/{type}/{value}:
    $ref: ./paths/management-history.yaml
  /health:
    $ref: ./paths/health.yaml
webhooks:
  multi-account-changed:
    $ref: ./webhooks/multiaccount-changed.yaml
  identification.scored:
    $ref: ./webhooks/identification-scored.yaml
  webhook.ping:
    $ref: ./webhooks/webhook-ping.yaml
components:
  securitySchemes:
    historyApiKey:
      $ref: ./components/securitySchemes/historyApiKey.yaml
    managementSecretKey:
      $ref: ./components/securitySchemes/managementSecretKey.yaml
