openapi: 3.1.0
info:
  title: ShieldLabs API
  version: 1.0.1
  summary: Identification results and risk scoring for your backend.
  description: |-
    ShieldLabs provides identification, risk signals and risk scoring. The public History API
    serves domain-scoped entity lists and cards. Signed scored webhooks use a separate payload
    shape: an entity card must not be normalized as a legacy row or a scored webhook.

    ## How it fits

    1. The browser SDK returns an identification ID for a visit or protected action.
    2. Your backend reads its card at `/api/v1/domains/{domain_id}/history/identifications/{resource_id}`
       or receives a signed `identification.scored` webhook.
    3. Check ownership, freshness, replay protection and the actual availability state before
       applying your application's policy. An ID alone does not prove successful ingest.

    ## Hosts and credentials

    | API | Host | Credentials |
    |---|---|---|
    | History | `https://account.shieldlabs.ai` | Server-only `Authorization: Bearer <Private API Key>` |
    | Management | `https://api.shieldlabs.ai` | Server-only `X-Shield-Domain` and Secret Key |

    `{domain_id}` in History is the public domain UUID from `GET /api/v1/domains`, not a hostname.
    Lists are available for `identifications` and `user`. Cards are available for `identifications`,
    `user`, `visitor`, `device` and `ip`. Session and cookie are identification fields, not resources.
    The old unscoped `/api/v1/history/{search_type}/{value}` route is retired with HTTP 410.
    Keep server keys and webhook secrets off the browser; only the public browser key goes there.
    Accounts and configuration are available in the dashboard at https://app.shieldlabs.ai.

    ## Risk and availability

    An identification card uses `type: identification`, `id`, `domain_id`, `domain`, nested
    `risk` and `signals`. Use `risk.score` only when `risk.state` is `ok` and a score is present.
    `risk.state: unavailable` is unknown, never Score 0. Bands are Trusted 0-29, Suspicious 30-59
    and Dangerous 60-100. Missing signal weights do not mean nothing contributed to a score.
    Entity counts are backend aggregates, not a list of analyzed identifications. Preserve
    `high_risk_events` availability and confidence separately from Risk Score.
    Scored webhook payloads use `identification_id`, `risk_score` and weighted `signals`.
    Legacy 999 markers are not numeric risk scores and must not be fabricated from missing data.

    ## Pagination and time

    Lists return `data` and an opaque `next_page_token`. Pass the token as `page_token`.
    Filters are repeated query parameters: `risk_bands`, `is_*` flags (`true` or `false`, AND),
    `risk_signals` (OR), and `source` with `campaign` (one OR group, at most 8). A nested `filter`,
    `chips`, and `offset` return `400`. `is_abuser`, `is_datacenter` and
    `is_stun_not_checked` return `400`.
    Identification timestamps and risk `as_of` are RFC3339. Nullable fields remain unavailable.

    ## Errors and retries

    Entity errors use `{"error":{"code":"...","message":"..."}}`. Handle the controlled
    code together with HTTP status. Missing entities return 404; retired routes return 410;
    invalid queries return 400; snapshot failures return 503. Authentication and gateway errors
    can use their own envelopes. Do not log credentials or raw private diagnostic bodies.
    Retry reads within a bounded budget, respecting Retry-After and cancellation. Never retry
    mutations automatically. A missing History result does not establish a billing cause.

    ## Webhooks

    ShieldLabs creates one logical signed event per identification and enabled endpoint.
    Contract `2026-10-13` includes the identification score, named signals, detection flags,
    including search bots, AI bots and AI browsers, and account-event evaluations.
    ShieldLabs identifies the provider of recognized bots and AI browsers when available.
    Multi-account group changes use a separate event. Current user risk categories
    are separate from the score of one identification.
    Delivery attempts have a 1-second HTTP timeout. Network errors, timeouts, 429 and 5xx
    retry with backoff, up to 8 failed sends or a 15-minute retry age; other 4xx are terminal.
    Retries preserve the exact signed body and
    `event_id`; duplicate deliveries remain possible after an accepted request loses its response.
    Verify the signature, durably store the event using its signed `event_id` (legacy fallback:
    `data.identification_id`), then answer 2xx within a second and process asynchronously.
    Redirects are not followed. A later History refinement does not create a new webhook event.
    Use the History API for the latest stored result. See the `identification.scored` and
    `webhook.ping` entries for the signature algorithm.

    ## Compatibility

    Ignore fields you do not know, keep unknown values of string fields (such as new signal names
    or channels) instead of failing, and accept webhook `schema_version` values other than
    `2026-10-13` (current) or a supported older version.

    Start free at https://app.shieldlabs.ai. Guides: https://docs.shieldlabs.ai.
