servers:
  - url: https://account.shieldlabs.ai
    description: History API
get:
  operationId: listHistoryEntities
  tags:
    - History API
  summary: List History entities
  description: |-
    Lists `identifications` or `user` for one domain. `{domain}` is the public domain UUID.
    Literal `all` returns `403 domain_scope_not_supported`. A list of `visitor`, `device` or `ip`
    returns `403 entity_list_disabled`. `session` and `cookie` are not resources.

    The old `/api/v1/history/{search_type}/{value}` route returns `410 endpoint_retired`.
    Page with `page_token`, not `offset`. `from` and `to` are both required when either is set,
    RFC3339, and the window is half-open.
  security:
    - historyApiKey: []
  parameters:
    - name: domain
      in: path
      required: true
      description: Public domain UUID of the site whose History is being read.
      schema:
        type: string
        format: uuid
      examples:
        owned:
          value: 00000000-0000-4000-8000-000000000031
    - name: resource
      in: path
      required: true
      description: History resource. Lists are enabled for identifications and user only.
      schema:
        type: string
        enum: [identifications, user, visitor, device, ip]
      examples:
        identifications:
          value: identifications
    - name: limit
      in: query
      required: false
      description: Maximum records in the page, from 1 through 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      examples:
        page:
          value: 20
    - name: page_token
      in: query
      required: false
      description: Opaque token from the previous page. Omit it on the first page.
      schema:
        type: string
      examples:
        next:
          value: next-page
    - name: from
      in: query
      required: false
      description: Inclusive RFC3339 start. Send `to` as well, or send neither.
      schema:
        type: string
        format: date-time
      examples:
        start:
          value: '2026-10-27T00:00:00Z'
    - name: to
      in: query
      required: false
      description: Exclusive RFC3339 end. Send `from` as well, or send neither.
      schema:
        type: string
        format: date-time
      examples:
        end:
          value: '2026-10-28T00:00:00Z'
  responses:
    '200':
      description: A page of entity records.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  type: object
                  required: [type, id, risk, signals]
                  properties:
                    type:
                      type: string
                      enum: [identification, user, visitor, device, ip]
                    id:
                      type: string
                    risk:
                      type: object
                      required: [state]
                      properties:
                        state:
                          type: string
                          enum: [ok, unavailable]
                        band:
                          type: string
                          enum: [trusted, suspicious, dangerous]
                        score:
                          type: integer
                          minimum: 0
                          maximum: 100
                    signals:
                      type: object
                      required: [state, items]
                      properties:
                        state:
                          type: string
                          enum: [ok, unavailable]
                        items:
                          type: array
                          items:
                            type: string
              next_page_token:
                type: string
              total:
                type: integer
                minimum: 0
          examples:
            identifications:
              value:
                data:
                  - type: identification
                    id: a5b7c9d1-e3f5-4a7b-9c1d-3e5f7a9b1c3d
                    risk:
                      state: ok
                      band: suspicious
                      score: 42
                    signals:
                      state: unavailable
                      items: []
    '400':
      description: The query is not valid. `error.code` is `invalid_query` or `invalid_domain_scope`.
    '403':
      description: '`domain_scope_not_supported` or `entity_list_disabled`.'
    '401':
      $ref: ../components/responses/HistoryUnauthorized.yaml
