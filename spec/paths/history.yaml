servers:
  - url: https://account.shieldlabs.ai
    description: History API
get:
  operationId: searchHistory
  tags:
    - History API
  summary: Retired identification search
  description: |-
    This route returns `410 endpoint_retired` and does not run the search. Use
    `GET /api/v1/domains/{domain}/history/{resource}` and
    `GET /api/v1/domains/{domain}/history/{resource}/{id}`. `{domain}` is the public domain UUID.

    The description below is the previous contract, kept so existing field docs stay attached to this operation until clients move.

    Returns the identifications of your domain that match one identifier, newest first, together
    with the total number of matches. The Private API Key selects the domain; identifications from
    its subdomains are included (`domain` holds the host, `site_domain` the registered domain).

    **Read one verdict.** After a protected action, search by `identification_id` with `limit=1`. The row
    becomes available asynchronously, so start the identification when the user begins the
    action (for example when the signup form opens), not when the form is submitted. An empty
    `data` array means "not scored yet", never "clean". Poll with backoff (first try at once, then
    wait 250 ms, 500 ms, 1 s, then steps of about 1.5 s) and treat a `429` inside that loop as
    "wait longer". The official server SDKs do this for you.

    **Account-level checks.** Search by `device_id`, `user_hid`, `visitor_id` or `ip` to see how
    many accounts share a device, how many devices one account uses, or what else came from one
    IP address. When you count accounts, skip rows whose `user_hid` is empty or one of the values
    that do not identify a user: `anonymous`, `fail`, `-1` and `unknown`.

    **Narrow the page.** Optional filters keep rows that match every supplied constraint. Omit a
    parameter to leave that field unconstrained. `from` and `to` are inclusive UTC bounds, either
    `YYYY-MM-DD` (the whole day) or `YYYY-MM-DD HH:MM:SS` with optional fractional seconds.
    `score_from` and `score_to` are integers from 0 through 999, so `999` still selects the
    rate-limit marker. Each detection flag is `true` or `false` and uses the row's field name.
    `check_incomplete`, `is_js_disabled` and `is_incognito` follow the row: they are false for
    accepted search bots, AI bots and AI browsers. The removed filters `is_abuser`, `is_datacenter` and
    `is_suspicious_paid_click`, and the old name `is_stun_not_checked` return `400`, even when empty or `false`. Other unknown query
    parameters are ignored.

    **Validate before sending.** An unknown `search_type`, an invalid IPv4 address, a `limit`
    outside 1-100, a negative `offset`, or a filter value the server does not accept returns
    `400`. A value that is not a UUID can still fail the query with `500`.

    **Paging.** Page with `offset` while it is below `total`. Rows are ordered by `created_at`
    only, so paging while new identifications arrive can repeat or skip rows: deduplicate on
    `identification_id`. Filters apply to `total` as well as to `data`.

    **Latest state.** A row can be refined after the webhook was sent, for example when late
    network data re-scores it; its `ver` then increases. The History API always returns the latest
    version, which makes it the guaranteed read path.

    Reads are free: they do not use your included identifications.
  security:
    - historyApiKey: []
  parameters:
    - $ref: ../components/parameters/HistorySearchType.yaml
    - $ref: ../components/parameters/HistoryValue.yaml
    - $ref: ../components/parameters/HistoryLimit.yaml
    - $ref: ../components/parameters/HistoryOffset.yaml
    - $ref: ../components/parameters/HistoryFrom.yaml
    - $ref: ../components/parameters/HistoryTo.yaml
    - $ref: ../components/parameters/HistoryScoreFrom.yaml
    - $ref: ../components/parameters/HistoryScoreTo.yaml
    - $ref: ../components/parameters/HistoryFlagVpn.yaml
    - $ref: ../components/parameters/HistoryFlagTor.yaml
    - $ref: ../components/parameters/HistoryFlagProxy.yaml
    - $ref: ../components/parameters/HistoryFlagPrivacyRelay.yaml
    - $ref: ../components/parameters/HistoryFlagNetworkCheckIncomplete.yaml
    - $ref: ../components/parameters/HistoryFlagCheckIncomplete.yaml
    - $ref: ../components/parameters/HistoryFlagAntidetect.yaml
    - $ref: ../components/parameters/HistoryFlagOsMismatch.yaml
    - $ref: ../components/parameters/HistoryFlagOsNotDetected.yaml
    - $ref: ../components/parameters/HistoryFlagTimezoneMismatch.yaml
    - $ref: ../components/parameters/HistoryFlagJsDisabled.yaml
    - $ref: ../components/parameters/HistoryFlagBrowserAutomation.yaml
    - $ref: ../components/parameters/HistoryFlagIncognito.yaml
    - $ref: ../components/parameters/HistoryFlagSearchBot.yaml
    - $ref: ../components/parameters/HistoryFlagIpMismatch.yaml
    - $ref: ../components/parameters/HistoryFlagLatencyTest.yaml
    - $ref: ../components/parameters/HistoryFlagDeviceSpoofing.yaml
    - $ref: ../components/parameters/HistoryFlagBannedIp.yaml
    - $ref: ../components/parameters/HistoryFlagAiBot.yaml
    - $ref: ../components/parameters/HistoryFlagAiBrowser.yaml
  responses:
    '410':
      description: The unscoped search route is retired. `error.code` is `endpoint_retired`.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    const: endpoint_retired
                  message:
                    type: string
          examples:
            retired:
              value:
                error:
                  code: endpoint_retired
                  message: endpoint_retired
    '200':
      description: Matching identifications, newest first. `data` is empty when nothing matched.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/HistoryPage.yaml
          examples:
            page:
              $ref: ../components/examples/HistoryPage.yaml
            empty:
              $ref: ../components/examples/HistoryPageEmpty.yaml
    '400':
      $ref: ../components/responses/HistoryBadRequest.yaml
    '401':
      $ref: ../components/responses/HistoryUnauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/HistoryTooManyRequests.yaml
    '500':
      $ref: ../components/responses/HistoryServerError.yaml
    '502':
      $ref: ../components/responses/BadGateway.yaml
    '504':
      $ref: ../components/responses/GatewayTimeout.yaml
  x-codeSamples:
    - lang: Shell
      label: curl
      source: |
        curl "https://account.shieldlabs.ai/api/v1/history/identification_id/a5b7c9d1-e3f5-4a7b-9c1d-3e5f7a9b1c3d?limit=1" \
          -H "Authorization: Bearer $SHIELDLABS_API_KEY"
