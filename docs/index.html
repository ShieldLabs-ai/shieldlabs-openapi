<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShieldLabs API reference</title>
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="OpenAPI reference for the ShieldLabs History API, Management API, Health endpoint and webhooks."
    />
    <style>
      body {
        margin: 0;
        background: #f9fafb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .fallback {
        max-width: 40rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
        color: #111827;
      }
      .fallback a {
        color: #007a52;
      }
    </style>
  </head>
  <body>
    <!--
      Renders ../dist/shieldlabs-api.json, so serve the repository root (not docs/ alone):
        python3 -m http.server 8080   then open http://localhost:8080/docs/
    -->
    <div id="reference"></div>
    <div id="fallback" class="fallback" hidden>
      <h1>ShieldLabs API reference</h1>
      <p>
        The interactive reference could not be loaded. Download the OpenAPI document as
        <a href="../dist/shieldlabs-api.yaml">YAML</a> or <a href="../dist/shieldlabs-api.json">JSON</a>,
        or read the guides at <a href="https://docs.shieldlabs.ai">docs.shieldlabs.ai</a>.
      </p>
    </div>
    <noscript>
      <div class="fallback">
        <h1>ShieldLabs API reference</h1>
        <p>
          This page needs JavaScript. Download the OpenAPI document as
          <a href="../dist/shieldlabs-api.yaml">YAML</a> or <a href="../dist/shieldlabs-api.json">JSON</a>.
        </p>
      </div>
    </noscript>
    <script
      src="https://cdn.jsdelivr.net/npm/redoc@2.5.4/bundles/redoc.standalone.js"
      integrity="sha384-w447zOpYfw/1Tv/5AK9NfHTlQIqE3RVR6KY62jCyy9zNDgO64cMwGGP1Fj0zJVf5"
      crossorigin="anonymous"
    ></script>
    <script>
      (function () {
        var fallback = document.getElementById('fallback');
        if (typeof Redoc === 'undefined') {
          fallback.hidden = false;
          return;
        }
        Redoc.init(
          '../dist/shieldlabs-api.json',
          {
            expandResponses: '200',
            requiredPropsFirst: true,
            jsonSampleExpandLevel: 3,
            theme: { colors: { primary: { main: '#009966' } } },
          },
          document.getElementById('reference'),
          function (error) {
            if (error) fallback.hidden = false;
          },
        );
      })();
    </script>
  </body>
</html>
